<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f0f23">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Balha">
    <title>Balha - Your AI Assistant</title>
    <style>
        :root {
            --primary: #00d4aa;
            --primary-dark: #00a884;
            --primary-glow: rgba(0, 212, 170, 0.3);
            --bg: #0a0a1a;
            --surface: #12122a;
            --surface-light: #1e1e3f;
            --text: #f0f0ff;
            --text-secondary: #8888aa;
            --border: rgba(255,255,255,0.06);
            --shadow: 0 8px 32px rgba(0,0,0,0.5);
            --radius: 24px;
            --radius-sm: 16px;
        }

        [data-theme="light"] {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface-light: #f0f2f5;
            --text: #1a1a2e;
            --text-secondary: #666680;
            --border: rgba(0,0,0,0.06);
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
            --primary-glow: rgba(0, 212, 170, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html { height: 100%; overflow: hidden; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s;
        }

        /* ===== Header ===== */
        .header {
            background: var(--surface);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 20px var(--primary-glow);
            position: relative;
        }

        .logo-icon.speaking::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            animation: speakRing 1s ease-out infinite;
        }

        @keyframes speakRing {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .logo-status {
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary);
        }

        .status-dot.speaking {
            animation: pulseDot 1s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--surface-light);
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: var(--primary);
            color: white;
        }

        /* ===== Language Bar ===== */
        .lang-bar {
            background: var(--surface);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }

        .lang-bar::-webkit-scrollbar { display: none; }

        .lang-chip {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            font-family: inherit;
        }

        .lang-chip.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* ===== Chat ===== */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scroll-behavior: smooth;
        }

        .welcome {
            text-align: center;
            padding: 50px 20px;
            animation: fadeIn 0.6s ease;
        }

        .welcome-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .welcome h2 {
            font-size: 26px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--primary), #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .welcome p {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.7;
            max-width: 300px;
            margin: 0 auto;
        }

        .message {
            max-width: 85%;
            padding: 16px 20px;
            border-radius: var(--radius);
            line-height: 1.7;
            font-size: 15.5px;
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            word-wrap: break-word;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .message-user {
            align-self: flex-start;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-bottom-left-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,212,170,0.2);
        }

        .message-bot {
            align-self: flex-end;
            background: var(--surface-light);
            color: var(--text);
            border-bottom-right-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .message-time {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .msg-actions {
            display: flex;
            gap: 8px;
        }

        .msg-btn {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.5;
            font-size: 15px;
            cursor: pointer;
            padding: 2px;
            transition: opacity 0.2s;
        }

        .msg-btn:active { opacity: 1; }

        /* ===== Speaking Wave ===== */
        .speaking-wave {
            display: none;
            align-items: center;
            gap: 3px;
            height: 20px;
        }

        .speaking-wave.active {
            display: flex;
        }

        .wave-bar {
            width: 3px;
            background: var(--primary);
            border-radius: 3px;
            animation: wave 0.8s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
        .wave-bar:nth-child(2) { height: 14px; animation-delay: 0.1s; }
        .wave-bar:nth-child(3) { height: 10px; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 16px; animation-delay: 0.3s; }
        .wave-bar:nth-child(5) { height: 8px; animation-delay: 0.15s; }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }

        /* ===== Typing ===== */
        .typing {
            display: none;
            align-self: flex-end;
            background: var(--surface-light);
            padding: 18px 22px;
            border-radius: var(--radius);
            border-bottom-right-radius: 8px;
            gap: 5px;
            border: 1px solid var(--border);
        }

        .typing.active { display: flex; }

        .typing span {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
        }

        /* ===== Input ===== */
        .input-area {
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 12px 16px;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface-light);
            border-radius: 28px;
            padding: 6px;
            border: 1.5px solid var(--border);
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .input-field {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 16px;
            padding: 12px 14px;
            font-family: inherit;
            line-height: 1.5;
            max-height: 120px;
            resize: none;
        }

        .input-field::placeholder {
            color: var(--text-secondary);
        }

        .mic-btn, .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mic-btn {
            background: transparent;
            color: var(--text-secondary);
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            color: white;
            animation: recordPulse 1.5s infinite;
        }

        @keyframes recordPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,68,68,0.4); }
            50% { box-shadow: 0 0 0 14px rgba(255,68,68,0); }
        }

        .send-btn {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(0,212,170,0.3);
        }

        .send-btn:active { transform: scale(0.92); }
        .send-btn:disabled { opacity: 0.4; }

        /* ===== Modal ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.2s;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            width: 100%;
            max-width: 440px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: modalUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes modalUp {
            from { transform: translateY(60px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }

        .modal-close {
            background: var(--surface-light);
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .modal-close:active { background: var(--primary); color: white; }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            max-height: 60vh;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
        }

        .toggle-switch {
            width: 52px;
            height: 30px;
            background: var(--border);
            border-radius: 15px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 26px;
            height: 26px;
            background: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .toggle-switch.active::after {
            transform: translateX(22px);
        }

        .save-btn {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn:active { transform: scale(0.98); }

        .hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
            line-height: 1.5;
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            color: var(--text);
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 2000;
            white-space: nowrap;
            backdrop-filter: blur(10px);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        /* ===== Responsive ===== */
        @media (min-width: 768px) {
            .message { max-width: 70%; font-size: 16px; }
            .chat-container { padding: 20px 15%; }
        }

        @media (max-width: 380px) {
            .logo-name { font-size: 18px; }
            .lang-chip { padding: 6px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon" id="logoIcon">🤖</div>
            <div class="logo-text">
                <div class="logo-name">Balha</div>
                <div class="logo-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="statusText">Online</span>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="clearChat()" title="Clear">🗑️</button>
            <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌓</button>
            <button class="icon-btn" onclick="openSettings()" title="Settings">⚙️</button>
        </div>
    </header>

    <!-- Language Bar -->
    <div class="lang-bar" id="langBar">
        <button class="lang-chip active" data-lang="ar-SA">🇸🇦 العربية</button>
        <button class="lang-chip" data-lang="en-US">🇺🇸 English</button>
        <button class="lang-chip" data-lang="fr-FR">🇫🇷 Français</button>
        <button class="lang-chip" data-lang="es-ES">🇪🇸 Español</button>
        <button class="lang-chip" data-lang="tr-TR">🇹🇷 Türkçe</button>
        <button class="lang-chip" data-lang="hi-IN">🇮🇳 हिन्दी</button>
        <button class="lang-chip" data-lang="de-DE">🇩🇪 Deutsch</button>
        <button class="lang-chip" data-lang="ja-JP">🇯🇵 日本語</button>
    </div>

    <!-- Chat -->
    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">🤖</div>
            <h2>I'm Balha</h2>
            <p>Your multilingual AI assistant.<br>Choose a language and start talking!</p>
        </div>
    </div>

    <!-- Typing -->
    <div class="typing" id="typing">
        <span></span><span></span><span></span>
    </div>

    <!-- Input -->
    <div class="input-area">
        <div class="input-wrapper">
            <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
            <textarea class="input-field" id="messageInput" 
                placeholder="Type your message..." 
                rows="1"
                oninput="autoResize(this)"
                onkeydown="handleKey(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">⬆️</button>
        </div>
    </div>

    <!-- Settings -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title">⚙️ Settings</h3>
                <button class="modal-close" onclick="closeSettings()">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">🔑 Gemini API Key</label>
                    <input type="password" class="form-input" id="apiKeyInput" placeholder="AIzaSy...">
                    <div class="hint">Get your free key from aistudio.google.com</div>
                </div>
                <div class="form-group">
                    <label class="form-label">🧠 AI Model</label>
                    <select class="form-select" id="modelSelect">
                        <option value="gemini-2.5-flash">Gemini 2.5 Flash (Fast)</option>
                        <option value="gemini-2.5-pro">Gemini 2.5 Pro (Smart)</option>
                    </select>
                </div>
                <div class="form-group">
                    <div class="toggle-row">
                        <span class="form-label" style="margin:0">🔊 Auto Speak</span>
                        <div class="toggle-switch active" id="autoSpeakToggle" onclick="toggleAutoSpeak()"></div>
                    </div>
                    <div class="hint">Balha will speak responses automatically</div>
                </div>
                <button class="save-btn" onclick="saveSettings()">💾 Save</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ========== State ==========
        let apiKey = localStorage.getItem('gemini_key') || '';
        let model = localStorage.getItem('gemini_model') || 'gemini-2.5-flash';
        let autoSpeak = localStorage.getItem('auto_speak') !== 'false';
        let currentLang = localStorage.getItem('chat_lang') || 'ar-SA';
        let isRecording = false;
        let recognition = null;
        let isSpeaking = false;
        let chatHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');
        let voicesLoaded = false;
        let synthVoices = [];

        // ========== Languages ==========
        const LANGS = {
            'ar-SA': { name: 'العربية', dir: 'rtl', greeting: 'أنا Balha\nمساعدك الذكي متعدد اللغات.\nاختر لغتك وابدأ المحادثة!', placeholder: 'اكتب رسالتك...' },
            'en-US': { name: 'English', dir: 'ltr', greeting: "I'm Balha\nYour multilingual AI assistant.\nChoose a language and start talking!", placeholder: 'Type your message...' },
            'fr-FR': { name: 'Français', dir: 'ltr', greeting: 'Je suis Balha\nVotre assistant IA multilingue.\nChoisissez une langue et commencez!', placeholder: 'Tapez votre message...' },
            'es-ES': { name: 'Español', dir: 'ltr', greeting: 'Soy Balha\nTu asistente de IA multilingüe.\n¡Elige un idioma y empieza!', placeholder: 'Escribe tu mensaje...' },
            'tr-TR': { name: 'Türkçe', dir: 'ltr', greeting: 'Ben Balha\nÇok dilli AI asistanınız.\nBir dil seçin ve konuşmaya başlayın!', placeholder: 'Mesajınızı yazın...' },
            'hi-IN': { name: 'हिन्दी', dir: 'ltr', greeting: 'मैं Balha हूँ\nआपका बहुभाषी AI सहायक।\nभाषा चुनें और बातचीत शुरू करें!', placeholder: 'अपना संदेश लिखें...' },
            'de-DE': { name: 'Deutsch', dir: 'ltr', greeting: 'Ich bin Balha\nIhr mehrsprachiger KI-Assistent.\nWählen Sie eine Sprache und beginnen Sie!', placeholder: 'Nachricht eingeben...' },
            'ja-JP': { name: '日本語', dir: 'ltr', greeting: '私はBalhaです\n多言語AIアシスタントです。\n言語を選んで会話を始めましょう！', placeholder: 'メッセージを入力...' }
        };

        // ========== Init ==========
        function init() {
            // Theme
            if (localStorage.getItem('theme') === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            }

            // Load voices
            loadVoices();
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = loadVoices;
            }

            // Language
            setLanguage(currentLang, false);

            // Speech recognition
            initSpeech();

            // History
            if (chatHistory.length > 0) {
                document.getElementById('welcome').style.display = 'none';
                chatHistory.forEach(msg => renderMessage(msg.text, msg.type, msg.time, false));
            }

            // Language chips
            document.querySelectorAll('.lang-chip').forEach(chip => {
                chip.addEventListener('click', () => setLanguage(chip.dataset.lang, true));
            });

            // Auto-speak UI
            updateAutoSpeakUI();

            // iOS: unlock audio on first touch
            document.body.addEventListener('touchstart', unlockAudio, { once: true });
            document.body.addEventListener('click', unlockAudio, { once: true });
        }

        function loadVoices() {
            synthVoices = window.speechSynthesis.getVoices();
            voicesLoaded = true;
        }

        function unlockAudio() {
            // iOS Safari requires user interaction before speech
            const u = new SpeechSynthesisUtterance('');
            u.volume = 0;
            window.speechSynthesis.speak(u);
            window.speechSynthesis.cancel();
        }

        function setLanguage(lang, save) {
            currentLang = lang;
            const cfg = LANGS[lang];

            document.querySelectorAll('.lang-chip').forEach(c => {
                c.classList.toggle('active', c.dataset.lang === lang);
            });

            document.documentElement.dir = cfg.dir;
            document.documentElement.lang = lang.split('-')[0];

            const input = document.getElementById('messageInput');
            input.placeholder = cfg.placeholder;

            // Update welcome
            const welcome = document.getElementById('welcome');
            if (welcome && chatHistory.length === 0) {
                welcome.querySelector('h2').textContent = lang === 'ar-SA' ? 'أنا Balha' : "I'm Balha";
                welcome.querySelector('p').innerHTML = cfg.greeting.replace(/\n/g, '<br>');
            }

            if (save) {
                localStorage.setItem('chat_lang', lang);
                showToast(`🌍 ${cfg.name}`);
            }
        }

        // ========== Speech Recognition ==========
        function initSpeech() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                document.getElementById('micBtn').style.display = 'none';
                return;
            }

            recognition = new SR();
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('messageInput').value = text;
                stopRecording();
                sendMessage();
            };

            recognition.onerror = (e) => {
                stopRecording();
                showToast('❌ ' + e.error);
            };

            recognition.onend = () => stopRecording();
        }

        function toggleVoice() {
            if (!recognition) {
                showToast('❌ Speech not supported');
                return;
            }
            if (isRecording) {
                recognition.stop();
            } else {
                recognition.lang = currentLang;
                recognition.start();
                isRecording = true;
                document.getElementById('micBtn').classList.add('recording');
            }
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('recording');
        }

        // ========== Chat ==========
        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            if (!apiKey) {
                showToast('⚠️ Add API Key first!');
                openSettings();
                return;
            }

            addToHistory(text, 'user');
            renderMessage(text, 'user', new Date().toISOString(), true);
            input.value = '';
            input.style.height = 'auto';

            document.getElementById('typing').classList.add('active');

            try {
                const response = await askGemini(text);
                document.getElementById('typing').classList.remove('active');

                addToHistory(response, 'bot');
                renderMessage(response, 'bot', new Date().toISOString(), true);

                if (autoSpeak) speak(response, currentLang);
            } catch (err) {
                document.getElementById('typing').classList.remove('active');
                renderMessage('❌ Error: ' + err.message, 'bot', new Date().toISOString(), true);
            }
        }

        function renderMessage(text, type, timeStr, animate) {
            const container = document.getElementById('chatContainer');
            const welcome = document.getElementById('welcome');
            if (welcome) welcome.style.display = 'none';

            const div = document.createElement('div');
            div.className = `message message-${type}`;
            if (animate) div.style.animation = 'slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1)';

            const time = new Date(timeStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const escaped = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');

            const isBot = type === 'bot';
            div.innerHTML = `
                <div style="white-space:pre-wrap">${escaped}</div>
                <div class="message-time">
                    ${time}
                    ${isBot ? `
                    <div class="speaking-wave" id="wave-${Date.now()}">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                    <div class="msg-actions">
                        <button class="msg-btn" onclick="speak('${escaped.replace(/'/g, "\\'")}', '${currentLang}')" title="Speak">🔊</button>
                        <button class="msg-btn" onclick="copyText('${escaped.replace(/'/g, "\\'")}')" title="Copy">📋</button>
                    </div>` : ''}
                </div>
            `;

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;

            // Store wave element for speaking indicator
            if (isBot) {
                const wave = div.querySelector('.speaking-wave');
                if (wave) wave.dataset.msgId = Date.now();
            }
        }

        function addToHistory(text, type) {
            chatHistory.push({ text, type, time: new Date().toISOString() });
            if (chatHistory.length > 200) chatHistory = chatHistory.slice(-200);
            localStorage.setItem('chat_history', JSON.stringify(chatHistory));
        }

        // ========== Gemini API ==========
        async function askGemini(text) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

            const langName = LANGS[currentLang].name;
            const systemPrompt = `You are Balha, a friendly AI assistant. Always respond in ${langName}. Be helpful, concise, and natural.`;

            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ role: 'user', parts: [{ text }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.7, maxOutputTokens: 1000 }
                })
            });

            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.error?.message || 'API Error');
            }

            const data = await res.json();
            return data.candidates[0].content.parts[0].text;
        }

        // ========== Text to Speech (Balha Speaks!) ==========
        function speak(text, lang) {
            if (!('speechSynthesis' in window)) {
                showToast('❌ TTS not supported');
                return;
            }

            // Cancel any ongoing speech
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;

            // Find best voice for language
            const langPrefix = lang.split('-')[0];
            const voice = synthVoices.find(v => 
                v.lang.startsWith(lang) || 
                (langPrefix === 'ar' && v.lang.includes('ar')) ||
                (langPrefix === 'en' && v.lang === 'en-US') ||
                (langPrefix === 'fr' && v.lang === 'fr-FR') ||
                (langPrefix === 'es' && v.lang === 'es-ES') ||
                (langPrefix === 'de' && v.lang === 'de-DE') ||
                (langPrefix === 'ja' && v.lang === 'ja-JP') ||
                (langPrefix === 'hi' && v.lang === 'hi-IN') ||
                (langPrefix === 'tr' && v.lang === 'tr-TR')
            );

            if (voice) {
                utterance.voice = voice;
                console.log('Using voice:', voice.name, voice.lang);
            }

            // Show speaking indicator
            utterance.onstart = () => {
                isSpeaking = true;
                updateSpeakingUI(true);
            };

            utterance.onend = () => {
                isSpeaking = false;
                updateSpeakingUI(false);
            };

            utterance.onerror = (e) => {
                console.error('TTS error:', e);
                isSpeaking = false;
                updateSpeakingUI(false);
            };

            // Small delay for iOS
            setTimeout(() => {
                window.speechSynthesis.speak(utterance);
            }, 100);
        }

        function updateSpeakingUI(speaking) {
            const logoIcon = document.getElementById('logoIcon');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            if (speaking) {
                logoIcon.classList.add('speaking');
                statusDot.classList.add('speaking');
                statusText.textContent = 'Speaking...';
            } else {
                logoIcon.classList.remove('speaking');
                statusDot.classList.remove('speaking');
                statusText.textContent = 'Online';
            }

            // Update wave in last bot message
            const waves = document.querySelectorAll('.speaking-wave');
            waves.forEach(w => w.classList.remove('active'));
            if (speaking && waves.length > 0) {
                waves[waves.length - 1].classList.add('active');
            }
        }

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => showToast('📋 Copied!'));
        }

        // ========== Settings ==========
        function openSettings() {
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('modelSelect').value = model;
            updateAutoSpeakUI();
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.remove('active');
        }

        function toggleAutoSpeak() {
            autoSpeak = !autoSpeak;
            updateAutoSpeakUI();
        }

        function updateAutoSpeakUI() {
            const toggle = document.getElementById('autoSpeakToggle');
            toggle.classList.toggle('active', autoSpeak);
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            model = document.getElementById('modelSelect').value;

            localStorage.setItem('gemini_key', apiKey);
            localStorage.setItem('gemini_model', model);
            localStorage.setItem('auto_speak', autoSpeak);

            closeSettings();
            showToast('💾 Saved!');
        }

        // ========== Utils ==========
        function clearChat() {
            if (!confirm(LANGS[currentLang].dir === 'rtl' ? 'مسح المحادثة؟' : 'Clear chat?')) return;
            chatHistory = [];
            localStorage.removeItem('chat_history');
            document.getElementById('chatContainer').innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">🤖</div>
                    <h2>${currentLang === 'ar-SA' ? 'أنا Balha' : "I'm Balha"}</h2>
                    <p>${LANGS[currentLang].greeting.replace(/\n/g, '<br>')}</p>
                </div>
            `;
            showToast('🗑️ Cleared');
        }

        function toggleTheme() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
            localStorage.setItem('theme', isLight ? 'dark' : 'light');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        // Close modal on overlay click
        document.getElementById('settingsModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeSettings();
        });

        // Init
        init();
    </script>
</body>
</html>
